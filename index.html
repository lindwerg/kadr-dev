<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>КАДР · dev</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F5F1;color:#191A18;font:16px/1.4 -apple-system,system-ui,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#151614;color:#EDEBE4}}
  p{margin:0;padding:24px;text-align:center}
</style>
</head>
<body>
<p id="m">Открываем студию…</p>
<script>
// Постоянный адрес dev-стенда КАДР для кнопки бота: переадресует на текущий
// туннель, сохраняя query и hash (в hash Telegram передаёт tgWebAppData).
(async () => {
  const m = document.getElementById('m');
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch('url.txt?t=' + Date.now(), { cache: 'no-store' });
      const u = (await r.text()).trim();
      if (/^https:\/\/[a-z0-9.-]+$/i.test(u)) {
        location.replace(u + '/' + location.search + location.hash);
        return;
      }
    } catch (e) {}
    await new Promise((res) => setTimeout(res, 1500));
  }
  m.textContent = 'Стенд разработки сейчас выключен. Попробуйте позже.';
})();
</script>
</body>
</html>
