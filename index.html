<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>КАДР · dev</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6F5F1; overscroll-behavior: none; touch-action: none; }
  @media (prefers-color-scheme: dark) { html, body { background: #151614; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  p { margin: 0; position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
      color: #8a8a84; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<p id="m">Открываем студию…</p>
<script>
// Постоянный адрес dev-стенда КАДР. Telegram встраивает мост
// (TelegramWebviewProxy) только в страницу, которую открыл сам, поэтому
// приложение с текущего туннеля показывается во встроенном фрейме, а команды
// моста пересылаются в обе стороны. Официальный telegram-web-app.js внутри
// фрейма сам шлёт команды родителю через postMessage.
(async () => {
  const m = document.getElementById('m');
  const sources = [
    () => fetch('https://api.github.com/repos/lindwerg/kadr-dev/contents/url.txt?ref=main&t=' + Date.now(),
      { cache: 'no-store', headers: { Accept: 'application/vnd.github.raw' } }),
    () => fetch('url.txt?t=' + Date.now(), { cache: 'no-store' }),
  ];
  let target = null;
  for (let i = 0; i < 3 && !target; i++) {
    for (const load of sources) {
      try {
        const r = await load();
        if (!r.ok) continue;
        const u = (await r.text()).trim();
        if (/^https:\/\/[a-z0-9.-]+$/i.test(u)) { target = u; break; }
      } catch (e) {}
    }
    if (!target) await new Promise((res) => setTimeout(res, 1500));
  }
  if (!target) { m.textContent = 'Стенд разработки сейчас выключен. Попробуйте позже.'; return; }

  const proxy = window.TelegramWebviewProxy;
  const diag = (stage, extra) => {
    try {
      fetch(target + '/dev-diag', { method: 'POST', mode: 'no-cors', keepalive: true,
        body: JSON.stringify({ stage: 'shell:' + stage, extra, hasProxy: typeof proxy, ua: navigator.userAgent.slice(0, 120) }) });
    } catch (e) {}
  };

  const frame = document.createElement('iframe');
  frame.allow = 'camera; microphone; clipboard-read; clipboard-write; fullscreen; web-share';
  frame.src = target + '/' + location.search + location.hash;

  // Telegram → приложение: клиент вызывает receiveEvent у открытой им страницы.
  const forward = (eventType, eventData) => {
    frame.contentWindow && frame.contentWindow.postMessage(JSON.stringify({ eventType, eventData }), target);
  };
  window.Telegram = { WebView: { receiveEvent: forward } };
  window.TelegramGameProxy = { receiveEvent: forward };
  window.TelegramGameProxy_receiveEvent = forward;

  // Приложение → Telegram: только от текущего туннеля.
  window.addEventListener('message', (event) => {
    if (event.origin !== target || event.source !== frame.contentWindow) return;
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }
    if (!data || !data.eventType || data.eventType === 'iframe_ready' || data.eventType === 'iframe_will_reload') return;
    if (proxy && typeof proxy.postEvent === 'function') {
      proxy.postEvent(data.eventType, JSON.stringify(data.eventData === undefined ? '' : data.eventData));
    } else if (window.external && 'notify' in window.external) {
      window.external.notify(JSON.stringify({ eventType: data.eventType, eventData: data.eventData }));
    }
  });

  frame.addEventListener('load', () => { m.remove(); diag('frame-load'); }, { once: true });
  document.body.appendChild(frame);
  diag('start');
})();
</script>
</body>
</html>
